name: Keep Streamlit App Alive

on:
  schedule:
    # Executa a cada 10 minutos (bem dentro do limite do GitHub Actions)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Permite executar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: |
          # URL do seu app no Streamlit Community Cloud
          APP_URL="https://dashboard-tcc.streamlit.app/"

          echo "🏓 Pinging Streamlit app at $(date)"

          # Faz requisição HTTP simples (sem seguir redirects)
          # Qualquer resposta (200, 303, 302, etc) indica que o app está vivo
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL")

          echo "HTTP Response Code: $HTTP_CODE"

          # Aceita qualquer código 2xx ou 3xx como sucesso
          if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
            echo "✅ App is alive and responding! (HTTP $HTTP_CODE)"
          else
            echo "⚠️ App may be down (HTTP $HTTP_CODE)"
            # Não falha o workflow - apenas avisa
            echo "Note: This may be temporary, will retry in 10 minutes"
          fi

      - name: Log Activity
        run: |
          echo "Last ping: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Next ping in ~10 minutes"
