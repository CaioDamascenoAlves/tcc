name: Compile LaTeX Monografia

on:
  push:
    branches:
      - master
    paths:
      - 'monografia/**'
      - '.github/workflows/compile-monografia.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'monografia/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: monografia
          latexmk_use_xelatex: false
          latexmk_use_lualatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Check for compilation errors
        if: failure()
        run: |
          echo "::error::LaTeX compilation failed! Check the logs above for details."
          exit 1

      - name: Upload PDF artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monografia-pdf
          path: monografia/main.pdf
          retention-days: 90

      - name: Get current date
        if: success() && github.ref == 'refs/heads/master'
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create release tag
        if: success() && github.ref == 'refs/heads/master'
        id: create_tag
        run: |
          TAG_NAME="monografia-build-${{ steps.date.outputs.date }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Commit and push PDF to repository
        if: success() && github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Copy PDF to root for easy access
          cp monografia/main.pdf monografia-latest.pdf

          git add monografia-latest.pdf

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m " Auto-compile: Update monografia PDF [skip ci]

            Compiled on: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

             Generated with [Claude Code](https://claude.com/claude-code)"
            git push
          fi

      - name: Create GitHub Release with PDF
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: Monografia Build - ${{ steps.date.outputs.date }}
          body: |
             **Compilação Automática da Monografia**

            **Detalhes:**
            -  Data: ${{ steps.date.outputs.date }}
            -  Commit: ${{ github.sha }}
            -  Branch: ${{ github.ref_name }}

            **Arquivos:**
            - `main.pdf` - Monografia completa compilada

            ---
             Compilado automaticamente via GitHub Actions

             Para citação acadêmica formal, aguarde a versão final com DOI via Zenodo após aprovação do TCC.
          files: monografia/main.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with PDF
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ' **Monografia compilada com sucesso!**\n\n O PDF foi gerado e está disponível nos artefatos do workflow.\n\n[Baixar artefato do build](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
